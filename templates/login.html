<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン | キリン屋 予約管理</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}">
  <style>
    body { background: #f7f4f0; }
    .login-card { max-width: 360px; margin: 120px auto; border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,.1); }
    .login-title { color: #8B1A1A; font-size: 1.4rem; font-weight: 700; text-align: center; }
  </style>
</head>
<body>
<div class="card login-card p-4">
  <p class="login-title mb-4">🍖 キリン屋 予約管理</p>
  {% if error %}
  <div class="alert alert-danger py-2 mb-3">パスワードが違います</div>
  {% endif %}
  <form method="post">
    <div class="mb-3">
      <label class="form-label fw-semibold">パスワード</label>
      <input type="password" name="pw" class="form-control form-control-lg" autofocus required>
    </div>
    <button type="submit" class="btn btn-danger w-100 fw-bold py-2">ログイン</button>
  </form>
</div>
</body>
</html>
